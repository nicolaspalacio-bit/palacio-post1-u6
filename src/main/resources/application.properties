# ---------------------------------------------------------------------------
# pedidos-service - configuracion de desarrollo y pruebas
# ---------------------------------------------------------------------------

spring.application.name=pedidos-service

# Base de datos H2 en memoria: no requiere un servidor externo para
# ejecutar el sistema ni la suite de pruebas.
spring.datasource.url=jdbc:h2:mem:pedidosdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Ejecuta schema.sql y data.sql en cada arranque (esquema recreado desde cero).
spring.sql.init.mode=always

# Consola H2 disponible en /h2-console durante el desarrollo local.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.com.tienda.pedidos=DEBUG
